  <body>
    <script>
      // Restore the saved theme before first paint, otherwise the default
      // palette flashes on every reload.
      try {
        var saved = localStorage.getItem("tsn-theme");
        if (saved) document.documentElement.dataset.theme = saved;
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
